<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060b">
<title>ARISE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Colour roles: blue = the System and actions, teal = done, violet = rewards (levels, ranks, Shadows),
   gold = due or needs you. Areas keep one colour each, shown only as an edge line and an outlined tag. No red. */
:root{
  --bg:#05060b; --panel:#0b0d16; --panel2:#0e1120;
  --sys:#4f8cff; --sys-line:#2a6df0; --sys-soft:rgba(79,140,255,.12); --sys-ink:#b9d0ff;
  --ok:#3fe0b5; --ok-soft:rgba(63,224,181,.1);
  --vio:#8b6cff; --vio-soft:rgba(139,108,255,.12); --vio-ink:#c8b8ff;
  --gold:#c9a14a; --gold-soft:rgba(201,161,74,.1);
  --ink:#e3e6f2; --head-ink:#e8ecff; --muted:#6f7694; --line:#1b1f33; --line2:#161a2b;
  --era:#120d2a; --era-accent:#a58cff;
  --radius:4px; --head:'Rajdhani','Arial Narrow',sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:radial-gradient(110% 55% at 50% -8%, #15103a 0%, #090a14 45%, var(--bg) 80%) fixed, var(--bg);
  color:var(--ink); font:14.5px/1.5 var(--body);
  min-height:100vh; padding-bottom:84px; -webkit-tap-highlight-color:transparent;
}
body.safe{background:radial-gradient(110% 55% at 50% -8%, #0b2a2a 0%, #071415 45%, var(--bg) 80%) fixed, var(--bg)}
.wrap{max-width:540px; margin:0 auto; padding:14px 16px 24px}
header.top{display:flex; align-items:center; gap:10px; padding:4px 0 12px}
header.top .brand{font-family:var(--head); font-weight:700; letter-spacing:.32em; color:var(--head-ink); font-size:19px}
header.top .date{color:var(--muted); font-size:12px; margin-left:auto; text-transform:uppercase; letter-spacing:.08em}
.iconbtn{background:none; border:1px solid var(--line); color:var(--muted); border-radius:var(--radius); padding:6px 9px; font-size:14px; cursor:pointer}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:2px 8px; border-radius:3px; border:1px solid var(--line); color:var(--muted); background:transparent; white-space:nowrap}
.chip.gold{border-color:rgba(201,161,74,.45); color:var(--gold)}
.chip.sys{border-color:rgba(79,140,255,.45); color:var(--sys-ink)}
.chip.vio{border-color:rgba(139,108,255,.5); color:var(--vio-ink)}
h2{font-family:var(--head); font-weight:700; font-size:17px; margin:24px 0 10px; color:var(--head-ink); letter-spacing:.12em; text-transform:uppercase}
h3{font-family:var(--head); font-weight:700; font-size:15px; margin:0 0 8px; color:var(--head-ink); letter-spacing:.08em; text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:12.5px} .gold{color:var(--gold)} .ok{color:var(--ok)} .vio{color:var(--vio-ink)}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin:10px 0}
.system{background:#070d1f; border:1px solid var(--sys-line); box-shadow:0 0 14px rgba(42,109,240,.16), inset 0 0 18px rgba(42,109,240,.06); border-radius:var(--radius); padding:13px 15px; margin:10px 0}
.system .line{font-family:var(--head); font-weight:600; font-size:17px; color:var(--head-ink); letter-spacing:.02em; line-height:1.3}
.system .line::before{content:"["; color:var(--sys); margin-right:3px}
.system .line::after{content:"]"; color:var(--sys); margin-left:3px}
.btn{appearance:none; border:1px solid rgba(79,140,255,.45); background:var(--sys-soft); color:var(--sys-ink); border-radius:var(--radius); padding:8px 13px; font:inherit; font-size:13.5px; cursor:pointer}
.btn:hover{background:rgba(79,140,255,.2)}
.btn.gold{border-color:var(--sys-line); background:#1c4fd0; color:#fff; font-weight:500}  /* the main action on a screen */
.btn.gold:hover{background:#2a5fe6}
.btn.ghost{border-color:var(--line); background:transparent; color:var(--muted)}
.btn.small{padding:5px 10px; font-size:12.5px}
.btn.on{background:var(--ok-soft); border-color:rgba(63,224,181,.55); color:var(--ok)}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
.quest{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--line2)}
.quest:first-of-type{border-top:0}
.quest .num{font-family:var(--head); font-weight:700; color:var(--sys); width:20px; flex:none; padding-top:1px}
.quest .body{flex:1; min-width:0}
.quest .t{font-weight:500}
.quest .d{color:var(--muted); font-size:12.5px}
.quest .acts{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap}
.quest.done .t{color:var(--ok)}
.bar{height:6px; border-radius:2px; background:#141828; overflow:hidden}
.bar > i{display:block; height:100%; background:linear-gradient(90deg, var(--sys-line), var(--sys)); border-radius:2px}
.bar.gold > i{background:linear-gradient(90deg, #8f6f2c, var(--gold))}
.bar.ok > i{background:linear-gradient(90deg, #1f9c80, var(--ok))}
.stat{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:14px}
.stat .k{color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=tel],textarea,select{
  width:100%; background:#070810; color:var(--ink); border:1px solid var(--line); border-radius:var(--radius); padding:9px 11px; font:inherit; color-scheme:dark}
input[type=radio],input[type=checkbox]{accent-color:var(--sys)}
textarea{min-height:90px; resize:vertical}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--sys-line)}
label.f{display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; letter-spacing:.02em}
.gate{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line2)}
.gate:first-child{border-top:0}
.gate .main{flex:1; min-width:0; cursor:pointer}
.gate .main.edge{border-left:2px solid var(--edge); padding-left:10px}
.gate .title{font-weight:500; word-wrap:break-word}
.gate .meta{display:flex; gap:5px; flex-wrap:wrap; margin-top:5px}
.check{width:26px; height:26px; flex:none; border-radius:var(--radius); border:1px solid rgba(79,140,255,.55); background:transparent; color:var(--sys); cursor:pointer; font-size:14px}
.check:hover{background:var(--sys-soft); color:var(--ok); border-color:var(--ok)}
.prompt{font-size:12.5px; color:var(--gold); margin-top:5px}
nav.tabs{position:fixed; left:0; right:0; bottom:0; background:rgba(5,6,11,.96); border-top:1px solid var(--line); display:flex; justify-content:center; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); backdrop-filter:blur(8px); z-index:20}
nav.tabs .in{display:flex; gap:4px; width:100%; max-width:540px}
nav.tabs button{flex:1; background:none; border:0; border-top:2px solid transparent; color:var(--muted); font:inherit; font-size:11.5px; padding:6px 0; cursor:pointer}
nav.tabs button.active{color:var(--sys-ink); border-top-color:var(--sys)}
nav.tabs button b{display:block; font-family:var(--head); font-weight:700; font-size:15px; letter-spacing:.1em; text-transform:uppercase}
#toasts{position:fixed; top:12px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none; padding:0 16px}
#toasts .system{pointer-events:auto; max-width:508px; width:100%; margin:0; animation:pop .28s ease-out; cursor:pointer; background:#081232}
#toasts .system.goldt{border-color:var(--vio); background:#110a2c; box-shadow:0 0 22px rgba(139,108,255,.3)}
#toasts .system.goldt .line{color:var(--vio-ink)}
#toasts .system.goldt .line::before,#toasts .system.goldt .line::after{color:var(--vio)}
@keyframes pop{from{opacity:0; transform:translateY(-8px) scale(.98)} to{opacity:1; transform:none}}
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheet{width:100%; max-width:540px; max-height:88vh; overflow:auto; background:#090b14; border:1px solid var(--line); border-bottom:0; border-radius:10px 10px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px; height:3px; border-radius:2px; background:var(--line); margin:0 auto 12px}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:3px; padding:5px 11px; font:inherit; font-size:12.5px; cursor:pointer}
.seg button.sel{border-color:var(--sys-line); color:var(--sys-ink); background:var(--sys-soft)}
.mood{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.mood button{border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:var(--radius); padding:10px 2px; font:inherit; font-size:12px; cursor:pointer}
.mood button.sel{border-color:var(--sys); background:var(--sys-soft)}
.mood button span{display:block; font-family:var(--head); font-weight:700; font-size:20px; color:var(--sys)}
.floors{display:flex; gap:3px; margin:8px 0}
.floors i{flex:1; height:4px; border-radius:1px; background:#1a1e30}
.floors i.d{background:var(--ok)} .floors i.n{background:var(--sys)}
.loot{position:relative; height:10px; border-radius:2px; background:#141828; overflow:hidden; margin:6px 0}
.loot i{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#5b46c4,var(--vio))}
.loot b{position:absolute; top:-2px; bottom:-2px; width:2px; background:#fff}
.ripple{position:fixed; inset:0; pointer-events:none; z-index:55; background:radial-gradient(circle at 50% 50%, rgba(40,20,90,0) 0%, rgba(3,2,10,.85) 60%); animation:rip 1.1s ease-out forwards}
@keyframes rip{0%{opacity:0} 30%{opacity:1} 100%{opacity:0}}
.motes{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.motes i{position:absolute; width:3px; height:3px; border-radius:50%; background:var(--vio-ink); opacity:.5; animation:drift linear infinite}
@keyframes drift{from{transform:translateY(105vh)} to{transform:translateY(-10vh)}}
.border-camp{position:fixed; inset:6px; border:1px solid rgba(63,224,181,.35); border-radius:10px; pointer-events:none; z-index:1}
.fade{animation:fadeout .9s ease forwards}
@keyframes fadeout{to{opacity:0; transform:translateY(6px); filter:blur(2px)}}
.chapter{font-family:var(--body); line-height:1.75; color:#c9cde0}
.footer-links{display:flex; justify-content:space-between; margin-top:26px}
.footer-links button{background:none; border:0; color:var(--muted); font:inherit; font-size:12.5px; text-decoration:underline; cursor:pointer; padding:6px 0}
table.imp{width:100%; border-collapse:collapse; font-size:12.5px}
table.imp td,table.imp th{border-top:1px solid var(--line); padding:6px 4px; text-align:left; vertical-align:top}
table.imp th{color:var(--muted); font-weight:500}
.flag{color:var(--gold); font-size:12px}
details summary{cursor:pointer; color:var(--muted); font-size:13px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important} }
</style>
</head>
<body>
<div id="motes" class="motes" hidden></div>
<div id="camp" class="border-camp" hidden></div>
<div class="wrap">
  <header class="top">
    <span class="brand">ARISE</span>
    <span id="previewChip" class="chip sys" hidden>Preview: all on</span>
    <span class="date" id="dateLabel"></span>
    <button class="iconbtn" data-act="settings" aria-label="Settings">⚙</button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in">
  <button data-act="tab" data-tab="today"><b>Today</b>Quest</button>
  <button data-act="tab" data-tab="gates"><b>Gates</b>Tasks</button>
  <button data-act="tab" data-tab="week"><b>Week</b>Review</button>
  <button data-act="tab" data-tab="status"><b>Status</b>Paths</button>
</div></nav>
<div id="toasts"></div>
<div id="sheet" class="sheet-bg" hidden></div>
<script src="app.js"></script>
<script src="account.js"></script>
</body>
</html>
